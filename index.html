<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nバック課題</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>

<!-- ============ 設定 ============ -->
<section class="screen active" id="screen-setup">
  <div class="wrap">
    <h1>Nバック課題</h1>

    <div class="card n-card" id="card-n">
      <div class="card-label">N</div>
      <div class="n-picker">
        <button type="button" id="n-minus" class="n-step" aria-label="Nを下げる">−</button>
        <div id="n-value" class="n-value">2</div>
        <button type="button" id="n-plus" class="n-step" aria-label="Nを上げる">＋</button>
      </div>
      <p class="hint">何個前の刺激と一致するかを答える。第1段階では手動で選ぶ。</p>
    </div>

    <div class="card">
      <label class="field" id="row-modality">
        <span class="card-label">モダリティ</span>
        <select id="modality"></select>
      </label>

      <label class="field">
        <span class="card-label">応答方式</span>
        <select id="response-mode">
          <option value="realtime">リアルタイム判定 — 提示中に一致したら押す</option>
          <option value="paced">自分のペース — N個前に出たものを入力して次へ</option>
        </select>
      </label>

      <label class="field" id="row-paced-task" hidden>
        <span class="card-label">課題</span>
        <select id="paced-task"></select>
      </label>

      <label class="field" id="row-paced-answers" hidden>
        <span class="card-label">回答数</span>
        <input type="number" id="paced-answers" min="3" max="60" step="1" inputmode="numeric">
      </label>

      <p class="hint" id="setup-summary"></p>
      <p class="hint" id="setup-note"></p>
    </div>

    <details class="card">
      <summary>詳細設定</summary>

      <label class="field" id="row-target-rate">
        <span>ターゲット率 <output id="target-rate-out"></output></span>
        <input type="range" id="target-rate" min="10" max="50" step="1">
        <span class="hint">標準は 25〜30%。</span>
      </label>

      <label class="field" id="row-trials-extra">
        <span>1ブロックの試行数 = N + </span>
        <input type="number" id="trials-extra" min="5" max="200" step="1" inputmode="numeric">
      </label>

      <div id="row-timing">
        <label class="field">
          <span>刺激提示 (ms)</span>
          <input type="number" id="stimulus-ms" min="100" max="5000" step="50" inputmode="numeric">
        </label>

        <label class="field">
          <span>間隔 (ms)</span>
          <input type="number" id="isi-ms" min="200" max="10000" step="50" inputmode="numeric">
          <span class="hint">標準は提示 500ms / 間隔 2500ms（1試行 3000ms）。</span>
        </label>
      </div>

      <label class="field row" id="row-exclude-center">
        <input type="checkbox" id="exclude-center">
        <span>3×3グリッドの中央を使わない（標準）</span>
      </label>

      <div id="row-lure">
        <label class="field row">
          <input type="checkbox" id="lure">
          <span>ひっかけ (lure) を許す</span>
        </label>
        <p class="hint">N±1 の位置に同じ刺激を置く。難易度が大きく上がるので既定は OFF。</p>
        <p class="hint warn" id="lure-calc-note" hidden>計算モードでは効きません。式は毎回違う見た目になり、
          繰り返されるのは目に入らない「答え」だけなので、ひっかけとして働きません。OFF を勧めます。</p>
      </div>

      <button type="button" id="reset-settings" class="ghost">設定を既定に戻す</button>
    </details>

    <div class="actions">
      <button type="button" id="start" class="primary big">開始</button>
      <button type="button" id="to-history" class="ghost">履歴</button>
    </div>

    <p class="hint center" id="setup-help"></p>
  </div>
</section>

<!-- ============ 実行中 ============ -->
<section class="screen" id="screen-run">
  <header class="run-head">
    <div class="run-meta">
      <span id="run-n" class="badge"></span>
      <span id="run-modality"></span>
      <span id="run-phase" class="phase-tag" hidden></span>
      <span id="run-lure" class="lure-tag" hidden>ひっかけ</span>
      <span id="run-seed" class="mono dim"></span>
    </div>
    <div class="run-right">
      <span id="progress-text" class="mono"></span>
      <button type="button" id="abort" class="ghost mini">中止</button>
    </div>
    <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
  </header>

  <div class="run-body">
    <div id="countdown" class="countdown" hidden></div>
    <div id="stage" class="stage"></div>
  </div>

  <div id="pad" class="pad"></div>
</section>

<!-- ============ 結果 ============ -->
<section class="screen" id="screen-result">
  <div class="wrap">
    <h2>結果 <span id="result-head" class="dim"></span></h2>

    <div id="result-metrics" class="metrics"></div>

    <div id="result-detail"></div>

    <p class="advice" id="result-advice"></p>

    <p class="hint">乱数シード <span id="result-seed" class="mono"></span> — 同じ列で再挑戦できます。</p>

    <div class="actions">
      <button type="button" id="again" class="primary">もう1ブロック</button>
      <button type="button" id="again-same" class="ghost">同じ列で再挑戦</button>
      <button type="button" id="result-history" class="ghost">履歴</button>
      <button type="button" class="ghost to-setup">設定に戻る</button>
    </div>
  </div>
</section>

<!-- ============ 履歴 ============ -->
<section class="screen" id="screen-history">
  <div class="wrap">
    <h2>履歴 <span id="history-count" class="dim"></span></h2>

    <div class="history-bar">
      <label class="field inline">
        <span>モダリティ</span>
        <select id="history-filter"></select>
      </label>
      <label class="field inline">
        <span>方式</span>
        <select id="history-mode-filter"></select>
      </label>
      <div class="spacer"></div>
      <button type="button" id="export" class="ghost mini">書き出し (.jsonl)</button>
      <button type="button" id="import" class="ghost mini">読み込み</button>
      <input type="file" id="import-file" accept=".jsonl,.json,.txt,application/x-ndjson" hidden>
    </div>

    <div id="history-body"></div>

    <div class="actions">
      <button type="button" class="primary to-setup">設定に戻る</button>
      <button type="button" id="clear-history" class="ghost danger">履歴を全部消す</button>
    </div>

    <p class="hint">記録はこのブラウザの中（localStorage）に置いてあります。
      端末を移すときは書き出した .jsonl を読み込ませてください。</p>
  </div>
</section>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/modalities.js"></script>
<script src="js/runner.js"></script>
<script src="js/paced.js"></script>
<script src="js/storage.js"></script>
<script src="js/history.js"></script>
<script src="js/app.js"></script>
<script>
// オフラインで使えるようにする。
// Service Worker は保護されたコンテキスト（https か localhost）でしか動かないので、
// file:// や LAN の平文http で開いたときは navigator.serviceWorker 自体が無い。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 登録できなくても課題は動く */ });
  });
}
</script>
</body>
</html>
